# Run against all the files: pre-commit run -a
# Install the git hook scripts: pre-commit install


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-ast
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-yaml
        args: [--unsafe]
      - id: check-xml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        additional_dependencies: [flake8-docstrings]

  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
        args: [--skip-string-normalization]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v16.0.3
    hooks:
      - id: clang-format

  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-lint
        # CMake's find_package convention requires mujoco_VERSION/mujoco_FOUND,
        # which cmake-lint's naming rule rejects.
        exclude: ^docker/files/mujocoConfig\.cmake$

  - repo: local
    hooks:
      - id: mjcf-compile
        name: validate MJCF models
        description: Compile MJCF files with MuJoCo to catch modelling errors.
        entry: python3 tools/check_mjcf.py
        language: python
        language_version: python3
        additional_dependencies: [mujoco==4.0.1]
        files: \.xml$
        exclude: ^docker/

exclude: |
    (?x)(
        ^documentation/.*$
    )
